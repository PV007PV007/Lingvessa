packages:
  - 'apps/*'
  - 'packages/*'
saveExact: true
engineStrict: true
autoInstallPeers: false
strictPeerDependencies: true
# Reviewed native/tooling lifecycle scripts only.
allowBuilds:
  esbuild: true
  '@nestjs/core': true
  '@prisma/engines': true
  prisma: true
  sharp: true
# Narrow, pinned remediations for upstream transitive vulnerabilities.
# Revalidated by Prisma generation/config, Nest HTTP tests, builds and pnpm audit.
overrides:
  '@prisma/config@7.10.0>deepmerge-ts': 8.0.2
  'prisma@7.10.0>mysql2': 3.24.4
  '@nestjs/platform-express@12.0.1>multer': 2.4.0
  'ajv@8.20.0>fast-uri': 3.1.8
