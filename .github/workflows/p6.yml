name: P6 English reference preparation
on:
  push:
    branches: ['implementation/p6-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: p6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p6-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:baseline
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm check:secrets
      - run: node --import tsx --test tests/unit/p6-reference.test.ts
      - run: node --import tsx --test tests/unit/p6-authored-unit.test.ts
      - run: python3 tests/unit/p6-final-input.test.py
      - run: node --import tsx tools/p6/reference-preflight.ts
      - run: node --import tsx tools/p6/authored-l01-check.ts
      - run: pnpm build:web
      - name: Install and launch the pinned Chromium headless shell
        timeout-minutes: 10
        run: |
          pnpm exec playwright install --only-shell chromium
          smoke() {
            node --input-type=module -e "import { chromium } from '@playwright/test'; const b = await chromium.launch(); try { const p = await b.newPage(); await p.goto('about:blank'); } finally { await b.close(); }"
          }
          if ! smoke; then
            sudo tee /etc/apt/apt.conf.d/99lingvessa-p6-timeouts >/dev/null <<'APT'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          APT
            pnpm exec playwright install-deps chromium
            smoke
          fi
      - name: Build pinned standalone S3 protocol test server
        run: go install github.com/minio/minio@9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
      - run: pnpm bootstrap:local
      - name: Execute nine complete authored SVG/text activities with PostgreSQL S3 and browser
        run: MINIO_BINARY="$(go env GOPATH)/bin/minio" node --env-file=.local/runtime.env --import tsx tools/p6/l01-postgres.ts --svg-text-slice
      # One new owner-authorized P6 push may consume a previously produced final-only artifact.
      # No exporter/rerun is invoked here. The receiver also pins the parent and rejects old requests.
      - name: Receive pinned final-only input for an explicit full lesson test
        id: full_input
        if: >-
          github.repository == 'PV007PV007/Lingvessa' && github.event_name == 'push' &&
          github.ref == 'refs/heads/implementation/p6-english-reference' &&
          contains(github.event.head_commit.message, '[p6:verify-final-l01]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/p6/receive-final-wavs.py hosted --request docs/p6/approved-input-request.json --out "$RUNNER_TEMP/p6-approved-input"
      - name: Execute the full 29-activity audio lesson on accepted input
        if: steps.full_input.outcome == 'success'
        env:
          P5_M01_AUDIO_ROOT: ${{ runner.temp }}/p6-approved-input/audio
        run: MINIO_BINARY="$(go env GOPATH)/bin/minio" node --env-file=.local/runtime.env --import tsx tools/p6/l01-postgres.ts --real-l01
      - name: Preserve scoped JSON reports; inspect evidence before accepting a gate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
          path: artifacts/p6/*.json
          if-no-files-found: error
          retention-days: 14
