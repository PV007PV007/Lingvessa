name: P1 foundation
on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: p1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p1-exit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:baseline
      - run: pnpm check
      - run: pnpm audit:dependencies
      - run: pnpm bootstrap:local
      - run: node --env-file=.local/runtime.env --import tsx --test tests/integration/*.test.ts
      - run: pnpm test:containers
      - name: Preserve generated gate evidence (no credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p1-${{ github.sha }}
          path: artifacts/p1/*.json
          if-no-files-found: ignore
          retention-days: 14
