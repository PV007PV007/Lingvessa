name: P3 lesson engine
on:
  push:
    branches: ['implementation/p3-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: p3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p3-exit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:baseline
      - run: pnpm check
      - run: pnpm validate:references
      - run: pnpm audit:dependencies
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm bootstrap:local
      - run: node --env-file=.local/runtime.env --import tsx --test tests/integration/*.test.ts
        env:
          P3_BROWSER_TESTS: 'true'
      - run: pnpm test:containers
      - name: Sanitized migration diagnostics on failure
        if: failure()
        run: |
          if test -f .local/runtime.env; then
            node --env-file=.local/runtime.env --import tsx tools/p2/sql-diagnostics.ts
          fi
      - name: Preserve generated P3 evidence (no credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p3-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
          path: |
            artifacts/p1/*.json
            artifacts/p2/*
            artifacts/p3/*
          if-no-files-found: error
          retention-days: 14
