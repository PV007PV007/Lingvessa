name: lingvessa-p1-local
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: lingvessa_local
      POSTGRES_PASSWORD: ${LINGVESSA_LOCAL_DB_PASSWORD:?Run pnpm bootstrap:local}
      POSTGRES_DB: lingvessa_p1_local
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - '127.0.0.1:${LINGVESSA_LOCAL_DB_PORT:-55432}:5432'
    volumes:
      - p1_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lingvessa_local -d lingvessa_p1_local']
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  p1_postgres:
